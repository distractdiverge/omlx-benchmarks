[project]
name = "omlx-bench"
version = "0.1.0"
description = "Drive oMLX performance, intelligence and context benchmarks one step at a time"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # stdlib only, see docs/adr/0004

[project.scripts]
omlx-bench = "omlx_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omlx_bench"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
