[project]
name = "omlx-bench"
version = "0.1.0"
description = "Drive oMLX performance, intelligence and context benchmarks one step at a time"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
omlx-bench = "omlx_bench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omlx_bench"]

[dependency-groups]
dev = ["pytest>=8"]
